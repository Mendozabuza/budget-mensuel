<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Budget mensuel</title>
  <meta name="description" content="Budget mensuel simple et guidé, hors ligne. Les données restent sur l’appareil.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Premier lancement : parcours guidé (contenu généré par app.js) -->
  <div id="setup" class="setup" hidden></div>

  <!-- Application -->
  <div id="main" hidden>
    <header class="topbar">
      <button type="button" class="icon-btn" id="prev-month" aria-label="Mois précédent">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="title"></h1>
      <button type="button" class="icon-btn" id="next-month" aria-label="Mois suivant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </header>

    <main>
      <section id="view-month" class="view"></section>
      <section id="view-savings" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
      <section id="view-edit" class="view" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Navigation">
      <button type="button" class="tab" data-view="month">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Mois</span>
      </button>
      <button type="button" class="tab" data-view="savings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
        <span>Épargne</span>
      </button>
      <button type="button" class="tab" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Réglages</span>
      </button>
    </nav>
  </div>

  <!-- Saisie d’un solde : compte courant ou livret -->
  <dialog id="dlg" aria-labelledby="dlg-title">
    <form id="dlg-form" method="dialog" novalidate>
      <h2 id="dlg-title"></h2>
      <p id="dlg-text" class="note"></p>
      <label class="field">
        <span>Montant</span>
        <span class="money"><input id="dlg-amount" inputmode="decimal" autocomplete="off"><span class="cur"></span></span>
      </label>
      <label class="dlg-neg" id="dlg-neg-wrap" hidden><input type="checkbox" id="dlg-neg"> Mon compte est à découvert (montant négatif)</label>
      <p id="dlg-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary" value="save">Enregistrer</button>
      <button type="submit" class="btn ghost" value="cancel">Annuler</button>
    </form>
  </dialog>

  <!-- Choix d’un emoji pour une ligne -->
  <dialog id="emo" aria-labelledby="emo-title">
    <h2 id="emo-title">Choisir un emoji</h2>
    <div class="emo-grid" id="emo-grid"></div>
    <div class="emo-own">
      <input id="emo-input" placeholder="Ou tapez-en un" autocomplete="off" aria-label="Taper un emoji">
      <button type="button" class="btn" id="emo-use">Utiliser</button>
    </div>
    <button type="button" class="btn ghost" id="emo-auto">Automatique (selon le nom)</button>
    <button type="button" class="btn ghost" id="emo-cancel">Annuler</button>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
